<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>PolyBot Paper Terminal</title>
  <style>
    :root {
      --bg: #07080a;
      --card: rgba(18, 20, 28, 0.72);
      --border: rgba(255,255,255,0.10);
      --text: #f8fafc;
      --muted: #8b95a5;
      --green: #00e676;
      --red: #ff3b30;
      --blue: #00e5ff;
      --orange: #f7931a;
      --gold: #facc15;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(0,229,255,0.25), transparent 40%),
        radial-gradient(circle at 90% 100%, rgba(247,147,26,0.25), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--gold);
    }

    .pill {
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    }

    .label {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.14em;
      margin-bottom: 8px;
    }

    .equity {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .box {
      background: rgba(0,0,0,0.24);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px;
    }

    .box .k {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .box .v {
      font-size: 15px;
      font-weight: 700;
    }

    .market-title {
      color: var(--blue);
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 12px;
    }

    .prices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .price {
      text-align: center;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 14px;
    }

    .price .name {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .price .num {
      font-size: 28px;
      font-weight: 800;
    }

    .yes { color: var(--blue); }
    .no { color: var(--orange); }
    .green { color: var(--green); }
    .red { color: var(--red); }

    .position {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .history .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .history .row:last-child { border-bottom: 0; }

    .h-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .h-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .pnl {
      font-weight: 800;
      min-width: 70px;
      text-align: right;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="top">
      <div class="brand">POLYBOT</div>
      <div class="pill" id="status">Syncing</div>
    </header>

    <section class="card">
      <div class="label">Paper Equity</div>
      <div class="equity" id="equity">$0.00</div>

      <div class="grid">
        <div class="box">
          <div class="k">Cash</div>
          <div class="v" id="cash">$0.00</div>
        </div>
        <div class="box">
          <div class="k">Open</div>
          <div class="v" id="openValue">$0.00</div>
        </div>
        <div class="box">
          <div class="k">ROI</div>
          <div class="v" id="roi">0.00%</div>
        </div>
      </div>

      <div class="grid" style="margin-top:8px;">
        <div class="box">
          <div class="k">Win %</div>
          <div class="v" id="winrate">0.0%</div>
        </div>
        <div class="box">
          <div class="k">W/L/U</div>
          <div class="v" id="wlu">0/0/0</div>
        </div>
        <div class="box">
          <div class="k">Realised</div>
          <div class="v" id="realised">$0.00</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="label">Live Market</div>
      <div class="market-title" id="marketTitle">Scanning...</div>

      <div class="prices">
        <div class="price">
          <div class="name">YES Ask</div>
          <div class="num yes" id="yes">—</div>
        </div>
        <div class="price">
          <div class="name">NO Ask</div>
          <div class="num no" id="no">—</div>
        </div>
      </div>

      <div class="position" id="position">Waiting for setup...</div>
    </section>

    <section class="card history">
      <div class="label">Recent Trades</div>
      <div id="history">No settled trades yet.</div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function money(x) {
      const n = Number(x);
      return '$' + (Number.isFinite(n) ? n : 0).toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function cents(x) {
      const n = Number(x);
      if (!Number.isFinite(n) || n <= 0) return '—';
      return Math.round(n * 100) + '¢';
    }

    function pct(x) {
      const n = Number(x);
      if (!Number.isFinite(n)) return '0.00%';
      return `${n >= 0 ? '+' : ''}${n.toFixed(2)}%`;
    }

    function signedMoney(x) {
      const n = Number(x);
      if (!Number.isFinite(n)) return '$0.00';
      return `${n >= 0 ? '+' : '-'}$${Math.abs(n).toFixed(2)}`;
    }

    function title(t) {
      if (!t) return 'Scanning...';
      return String(t)
        .replace(/Bitcoin/gi, 'BTC')
        .replace(/price/gi, '')
        .replace(/above/gi, '>')
        .replace(/below/gi, '<')
        .replace(/\?/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function renderHistory(items) {
      if (!items || !items.length) {
        $('history').textContent = 'No settled trades yet.';
        return;
      }

      $('history').innerHTML = items.slice(0, 5).map((t) => {
        const pnl = Number(t.pnl || 0);
        const cls = pnl >= 0 ? 'green' : 'red';
        return `
          <div class="row">
            <div>
              <div class="h-title">${String(t.reason || 'Trade').replaceAll('_', ' ')}</div>
              <div class="h-meta">${cents(t.entry)} → ${cents(t.exit)}</div>
            </div>
            <div class="pnl ${cls}">${signedMoney(pnl)}</div>
          </div>
        `;
      }).join('');
    }

    async function tick() {
      try {
        const res = await fetch('/api/live', { cache: 'no-store' });
        const data = await res.json();

        const stats = data.stats || {};
        const trade = data.trade || {};
        const prices = data.currentPrices || {};
        const market = data.market || {};
        const path = data.pathState || {};

        const equity = Number(stats.currentBalance || 0);
        const cash = Number(stats.cashBalance || 0);
        const openValue = Number(stats.openPositionValue || 0);
        const start = Number(stats.startingBalance || 0);
        const realised = Number(stats.realisedPnl || 0);

        const total = Number(stats.totalTrades || 0);
        const wins = Number(stats.wins || 0);
        const losses = Number(stats.losses || 0);
        const unresolved = Number(stats.unresolved || 0);

        const roi = start ? ((equity - start) / start) * 100 : 0;
        const wr = total ? (wins / total) * 100 : 0;

        $('equity').textContent = money(equity);
        $('cash').textContent = money(cash);
        $('openValue').textContent = money(openValue);
        $('roi').textContent = pct(roi);
        $('winrate').textContent = `${wr.toFixed(1)}%`;
        $('wlu').textContent = `${wins}/${losses}/${unresolved}`;
        $('realised').textContent = signedMoney(realised);

        $('marketTitle').textContent = title(market.title);
        $('yes').textContent = cents(prices.YES);
        $('no').textContent = cents(prices.NO);

        if (trade.active) {
          $('status').textContent = 'Holding';
          $('position').innerHTML = `
            Holding <strong>${trade.side}</strong> @ ${cents(trade.entryPrice)}<br/>
            State: ${String(trade.state || trade.quality || '').replaceAll('_', ' ')}<br/>
            MID: ${Number(path.yesMid || 0).toFixed(3)}
            D10: ${Number(path.d10 || 0).toFixed(3)}
            D30: ${Number(path.d30 || 0).toFixed(3)}
            RNG: ${Number(path.range || 0).toFixed(3)}
          `;
        } else {
          $('status').textContent = market.slug ? 'Hunting' : 'Syncing';
          $('position').innerHTML = market.slug
            ? `Waiting for setup...<br/>MID: ${Number(path.yesMid || 0).toFixed(3)} D10: ${Number(path.d10 || 0).toFixed(3)} D30: ${Number(path.d30 || 0).toFixed(3)}`
            : 'Awaiting market';
        }

        renderHistory(data.recentTrades || []);
      } catch (e) {
        $('status').textContent = 'Offline';
      }
    }

    tick();
    setInterval(tick, 1200);
  </script>
</body>
</html>
