<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>PolyBot Terminal</title>

  <style>
    :root {
      --bg: #050505;
      --card: rgba(18,18,22,0.75);
      --border: rgba(14,165,233,0.18);
      --text: #f1f5f9;
      --muted: #64748b;
      --cyan: #0ea5e9;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #facc15;

      /* pleasant gold accents */
      --gold-1: #f59e0b;
      --gold-2: #fcd34d;
      --gold-3: #fef08a;
      --gold-glow: rgba(252, 211, 77, 0.35);

      /* numeric fonts (avoid smooth/long UI font for numbers) */
      --money: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 24px 14px;
      background:
        radial-gradient(circle at top right, rgba(252,211,77,0.07), transparent 40%),
        radial-gradient(circle at top right, rgba(14,165,233,0.08), transparent 35%),
        radial-gradient(circle at bottom left, rgba(16,185,129,0.06), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: var(--ui);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .title {
      text-align: center;
      font-weight: 900;
      letter-spacing: 1.4px;
      margin-bottom: 18px;
      font-size: 1.45rem;
      background: linear-gradient(90deg, var(--gold-1), var(--gold-2), var(--gold-3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.22);
    }

    /* subtle gold gradient border where it matters (hero + engine status) */
    .card.gold {
      border: 1px solid transparent;
      background:
        linear-gradient(var(--card), var(--card)) padding-box,
        linear-gradient(135deg, rgba(245,158,11,0.40), rgba(252,211,77,0.26), rgba(254,240,138,0.10)) border-box;
    }

    .hero {
      text-align: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at top, rgba(252,211,77,0.06), transparent 55%),
        var(--card);
    }

    .sub {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.4px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* money numbers */
    .money {
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: 0;
    }

    .balance {
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 3rem;
      font-weight: 800;
    }

    .roi {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .roi.green {
      color: #34d399;
      background: rgba(16,185,129,0.14);
      border: 1px solid rgba(16,185,129,0.35);
    }

    .roi.red {
      color: #f87171;
      background: rgba(239,68,68,0.14);
      border: 1px solid rgba(239,68,68,0.35);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* add a small gold dot to headings for a nicer look */
    h2::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--gold-2);
      box-shadow: 0 0 10px var(--gold-glow);
      flex: 0 0 auto;
    }

    .metric {
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 1.55rem;
      font-weight: 800;
    }

    .small {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 4px;
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      word-break: break-word;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.03rem;
    }

    .pulse {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--gold-2);
      box-shadow: 0 0 12px var(--gold-glow);
      animation: blink 1.4s infinite;
      flex-shrink: 0;
    }

    .pulse.active {
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(14,165,233,0.65);
    }

    @keyframes blink {
      0% { opacity: 0.35; }
      50% { opacity: 1; }
      100% { opacity: 0.35; }
    }

    .book {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .book-card {
      background: rgba(0,0,0,0.24);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 12px;
      border-radius: 14px;
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
    }

    .label {
      color: var(--muted);
      font-family: var(--ui);
      font-size: 0.73rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .cyan { color: var(--cyan); }
    .green-text { color: var(--green); }
    .red-text { color: var(--red); }
    .yellow-text { color: var(--yellow); }

    .mode-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 0.78rem;
      font-weight: 900;
      margin-left: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .mode-paper {
      color: #93c5fd;
      background: rgba(59,130,246,0.12);
    }

    .mode-live {
      color: #f87171;
      background: rgba(239,68,68,0.13);
    }

    .ledger-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
    }

    .ledger-row:last-child {
      border-bottom: none;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      padding: 18px 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="title">PolyBot Terminal</div>

    <div class="card hero gold">
      <div class="sub">Portfolio</div>
      <div id="balance" class="balance money">$0.00</div>
      <div id="roi" class="roi green money">+0.00% ROI</div>
    </div>

    <div class="grid">
      <div class="card full gold">
        <h2>Engine Status <span id="mode-pill" class="mode-pill mode-paper">PAPER</span></h2>
        <div class="status-line">
          <div id="pulse" class="pulse"></div>
          <div id="status">INITIALISING</div>
        </div>
        <div id="last-action" class="small">Last: -</div>

        <div class="book">
          <div class="book-card">
            <div class="label">YES Book</div>
            <div>Ask: <span id="yes-ask" class="cyan money">---</span></div>
            <div>Bid: <span id="yes-bid" class="money">---</span></div>
            <div>Spread: <span id="yes-spread" class="money">---</span></div>
          </div>

          <div class="book-card">
            <div class="label">NO Book</div>
            <div>Ask: <span id="no-ask" class="cyan money">---</span></div>
            <div>Bid: <span id="no-bid" class="money">---</span></div>
            <div>Spread: <span id="no-spread" class="money">---</span></div>
          </div>
        </div>

        <div class="small" style="margin-top: 10px;">
          AskSum: <span id="ask-sum" class="money">---</span> |
          BidSum: <span id="bid-sum" class="money">---</span>
        </div>
      </div>

      <div class="card">
        <h2>Win Rate</h2>
        <div id="win-rate" class="metric cyan money">0.0%</div>
        <div id="win-details" class="small money">0W / 0L</div>
      </div>

      <div class="card">
        <h2>Executions</h2>
        <div id="total-trades" class="metric yellow-text money">0</div>
        <div class="small">Resolved trades</div>
      </div>

      <div class="card full">
        <h2>Trade Ledger</h2>
        <div id="history" class="empty">Awaiting executions...</div>
      </div>
    </div>
  </div>

  <script>
    // currency / number formatting (monetary look + separators)
    function money(amount, currency = 'USD') {
      const n = Number(amount);
      if (!Number.isFinite(n)) return '$0.00';
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency,
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(n);
    }

    function centsMoney(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || n <= 0) return '---';
      // value is dollars; convert to cents -> dollars again, but keep formatting stable
      return money(Math.round(n * 100) / 100);
    }

    function spreadDec(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || n <= 0) return '---';
      return n.toFixed(3);
    }

    async function updateDashboard() {
      try {
        const res = await fetch('/api/live');
        const data = await res.json();

        const stats = data.stats || {};
        const trade = data.trade || {};
        const book = data.currentBook || {};
        const yes = book.YES || {};
        const no = book.NO || {};

        // balance: proper money format (and numeric font via CSS class)
        document.getElementById('balance').innerText =
          money(stats.currentBalance || 0);

        const roi =
          stats.startingBalance
            ? (((stats.currentBalance - stats.startingBalance) / stats.startingBalance) * 100)
            : 0;

        const roiEl = document.getElementById('roi');
        roiEl.innerText = (roi >= 0 ? '+' : '') + roi.toFixed(2) + '% ROI';
        roiEl.className = 'roi ' + (roi >= 0 ? 'green' : 'red') + ' money';

        const winRate =
          stats.totalTrades > 0
            ? ((stats.wins / stats.totalTrades) * 100).toFixed(1)
            : '0.0';

        document.getElementById('win-rate').innerText = winRate + '%';
        document.getElementById('win-details').innerText =
          `${stats.wins || 0}W / ${stats.losses || 0}L`;
        document.getElementById('total-trades').innerText = stats.totalTrades || 0;

        const mode = (data.mode || 'paper').toUpperCase();
        const modePill = document.getElementById('mode-pill');
        modePill.innerText = mode;
        modePill.className = 'mode-pill ' + (mode === 'LIVE' ? 'mode-live' : 'mode-paper');

        document.getElementById('status').innerText =
          trade.readableStatus || trade.status || 'UNKNOWN';

        // last-action: keep as-is but ensure any numbers look tabular via .small font
        document.getElementById('last-action').innerText =
          'Last: ' + (trade.lastAction || '-');

        document.getElementById('pulse').className =
          trade.active ? 'pulse active' : 'pulse';

        // book numbers: show as money (not "smooth long fonts" + more monetary feel)
        document.getElementById('yes-ask').innerText = centsMoney(yes.ask);
        document.getElementById('yes-bid').innerText = centsMoney(yes.bid);
        document.getElementById('yes-spread').innerText = spreadDec(yes.spread);

        document.getElementById('no-ask').innerText = centsMoney(no.ask);
        document.getElementById('no-bid').innerText = centsMoney(no.bid);
        document.getElementById('no-spread').innerText = spreadDec(no.spread);

        document.getElementById('ask-sum').innerText = spreadDec(book.askSum);
        document.getElementById('bid-sum').innerText = spreadDec(book.bidSum);

        const history = data.recentTrades || [];
        const historyEl = document.getElementById('history');

        if (!history.length) {
          historyEl.className = 'empty';
          historyEl.innerText = 'Awaiting executions...';
        } else {
          historyEl.className = '';
          historyEl.innerHTML = history.map(t => {
            const pnl = Number(t.pnl || 0);
            const cls = pnl >= 0 ? 'green-text' : 'red-text';
            const sign = pnl >= 0 ? '+' : '';

            return `
              <div class="ledger-row">
                <div>
                  <div>${t.time || ''}</div>
                  <div class="small">${t.reason || ''}</div>
                </div>
                <div class="${cls}">${sign}${money(Math.abs(pnl))}</div>
              </div>
            `;
          }).join('');
        }
      } catch (e) {
        console.error('Dashboard sync error', e);
      }
    }

    setInterval(updateDashboard, 1500);
    updateDashboard();
  </script>
</body>
</html>
