<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>PolyBot Terminal</title>

  <style>
    :root {
      --bg: #050505;

      /* blue gradient cards */
      --card-top: rgba(14, 165, 233, 0.14);
      --card-bottom: rgba(30, 58, 138, 0.10); /* deep blue */
      --card-solid: rgba(18, 18, 22, 0.70);

      --border: rgba(14,165,233,0.20);
      --text: #f1f5f9;
      --muted: #94a3b8;

      --cyan: #0ea5e9;
      --green: #10b981;
      --red: #ef4444;

      /* gold gradient text */
      --gold-1: #f59e0b;
      --gold-2: #fcd34d;
      --gold-3: #fef08a;
      --gold-glow: rgba(252, 211, 77, 0.35);

      /* numeric font (less "smooth") */
      --money: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 24px 14px;
      background:
        radial-gradient(circle at top right, rgba(14,165,233,0.10), transparent 38%),
        radial-gradient(circle at bottom left, rgba(245,158,11,0.07), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: var(--ui);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .gold-text {
      background: linear-gradient(90deg, var(--gold-1), var(--gold-2), var(--gold-3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      text-shadow: 0 0 18px rgba(252, 211, 77, 0.08);
    }

    .title {
      text-align: center;
      font-weight: 900;
      letter-spacing: 1.4px;
      margin-bottom: 18px;
      font-size: 1.45rem;
    }

    .card {
      background:
        radial-gradient(circle at top, rgba(14,165,233,0.14), transparent 55%),
        linear-gradient(180deg, var(--card-top), var(--card-bottom)),
        var(--card-solid);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.22);
    }

    .hero {
      text-align: center;
      padding: 24px 16px;
    }

    .sub {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.4px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* numbers */
    .num {
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: 0;
    }

    .balance {
      font-size: 3rem;
      font-weight: 800;
    }

    .roi {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.95rem;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.18);
    }

    .roi.green {
      color: #34d399;
      border-color: rgba(16,185,129,0.35);
      background: rgba(16,185,129,0.14);
    }

    .roi.red {
      color: #f87171;
      border-color: rgba(239,68,68,0.35);
      background: rgba(239,68,68,0.14);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h2::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--gold-2);
      box-shadow: 0 0 10px var(--gold-glow);
      flex: 0 0 auto;
    }

    .metric {
      font-size: 1.55rem;
      font-weight: 800;
    }

    .small {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 4px;
      word-break: break-word;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.03rem;
    }

    .pulse {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--gold-2);
      box-shadow: 0 0 12px var(--gold-glow);
      animation: blink 1.4s infinite;
      flex-shrink: 0;
    }

    .pulse.active {
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(14,165,233,0.65);
    }

    @keyframes blink {
      0% { opacity: 0.35; }
      50% { opacity: 1; }
      100% { opacity: 0.35; }
    }

    .book {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .book-card {
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 12px;
      border-radius: 14px;
    }

    .label {
      color: var(--muted);
      font-size: 0.73rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .cyan { color: var(--cyan); }
    .green-text { color: var(--green); }
    .red-text { color: var(--red); }

    .mode-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 900;
      margin-left: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
    }

    .mode-paper {
      color: #93c5fd;
      border-color: rgba(147, 197, 253, 0.25);
      background: rgba(59,130,246,0.12);
    }

    .mode-live {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.28);
      background: rgba(239,68,68,0.13);
    }

    .ledger-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .ledger-row:last-child {
      border-bottom: none;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 18px 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="title gold-text">PolyBot Terminal</div>

    <div class="card hero">
      <div class="sub">Portfolio</div>
      <div id="balance" class="balance num gold-text">$0</div>
      <div id="roi" class="roi green num">+0% ROI</div>
    </div>

    <div class="grid">
      <div class="card full">
        <h2><span class="gold-text">Engine Status</span> <span id="modePill" class="mode-pill mode-paper">Paper</span></h2>
        <div class="status-line">
          <div id="pulse" class="pulse"></div>
          <div id="status" class="gold-text">Initializing</div>
        </div>
        <div id="lastAction" class="small">Last action: —</div>

        <div class="book">
          <div class="book-card">
            <div class="label">Yes Book</div>
            <div>Ask: <span id="yesAsk" class="cyan num">—</span></div>
            <div>Bid: <span id="yesBid" class="num">—</span></div>
            <div>Spread: <span id="yesSpread" class="num">—</span></div>
          </div>

          <div class="book-card">
            <div class="label">No Book</div>
            <div>Ask: <span id="noAsk" class="cyan num">—</span></div>
            <div>Bid: <span id="noBid" class="num">—</span></div>
            <div>Spread: <span id="noSpread" class="num">—</span></div>
          </div>
        </div>

        <div class="small" style="margin-top: 10px;">
          Ask sum: <span id="askSum" class="num">—</span> |
          Bid sum: <span id="bidSum" class="num">—</span>
        </div>
      </div>

      <div class="card">
        <h2><span class="gold-text">Win Rate</span></h2>
        <div id="winRate" class="metric cyan num">0%</div>
        <div id="winDetails" class="small num">0 wins / 0 losses</div>
      </div>

      <div class="card">
        <h2><span class="gold-text">Executions</span></h2>
        <div id="totalTrades" class="metric num gold-text">0</div>
        <div class="small">Resolved trades</div>
      </div>

      <div class="card full">
        <h2><span class="gold-text">Trade Ledger</span></h2>
        <div id="history" class="empty">Waiting for executions…</div>
      </div>
    </div>
  </div>

  <script>
    // whole-number formatting (no 0.02 style)
    function whole(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return '—';
      return String(Math.round(n));
    }

    // price to whole cents (e.g., $0.52 -> 52¢, but as a whole number)
    function wholeCents(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || n <= 0) return '—';
      return String(Math.round(n * 100)) + '¢';
    }

    // whole dollars (e.g., 1012.49 -> $1,012)
    function wholeDollars(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return '$0';
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(Math.round(n));
    }

    async function updateDashboard() {
      try {
        const res = await fetch('/api/live');
        const data = await res.json();

        const stats = data.stats || {};
        const trade = data.trade || {};
        const book = data.currentBook || {};
        const yes = book.YES || {};
        const no = book.NO || {};

        // Balance: whole dollars
        document.getElementById('balance').innerText =
          wholeDollars(stats.currentBalance || 0);

        // ROI: whole percent
        const roi =
          stats.startingBalance
            ? (((stats.currentBalance - stats.startingBalance) / stats.startingBalance) * 100)
            : 0;

        const roiEl = document.getElementById('roi');
        roiEl.innerText = (roi >= 0 ? '+' : '') + whole(roi) + '% ROI';
        roiEl.className = 'roi ' + (roi >= 0 ? 'green' : 'red') + ' num';

        // Win rate: whole percent, better grammar
        const winRate =
          stats.totalTrades > 0
            ? (stats.wins / stats.totalTrades) * 100
            : 0;

        document.getElementById('winRate').innerText = whole(winRate) + '%';
        document.getElementById('winDetails').innerText =
          `${whole(stats.wins || 0)} wins / ${whole(stats.losses || 0)} losses`;

        document.getElementById('totalTrades').innerText = whole(stats.totalTrades || 0);

        // Mode pill: nice capitalization
        const mode = String(data.mode || 'paper').toUpperCase();
        const modePill = document.getElementById('modePill');
        modePill.innerText = mode === 'LIVE' ? 'Live' : 'Paper';
        modePill.className = 'mode-pill ' + (mode === 'LIVE' ? 'mode-live' : 'mode-paper');

        // Status: no underscores; make it readable
        const rawStatus = trade.readableStatus || trade.status || 'UNKNOWN';
        const readableStatus = String(rawStatus)
          .replace(/[_-]+/g, ' ')
          .toLowerCase()
          .replace(/\b\w/g, c => c.toUpperCase());

        document.getElementById('status').innerText = readableStatus;

        // Last action: nicer punctuation; remove underscores
        const last = trade.lastAction
          ? String(trade.lastAction).replace(/[_-]+/g, ' ')
          : '—';
        document.getElementById('lastAction').innerText = 'Last action: ' + last;

        document.getElementById('pulse').className =
          trade.active ? 'pulse active' : 'pulse';

        // Books: whole cents + whole-number spreads
        document.getElementById('yesAsk').innerText = wholeCents(yes.ask);
        document.getElementById('yesBid').innerText = wholeCents(yes.bid);
        document.getElementById('yesSpread').innerText = whole(yes.spread);

        document.getElementById('noAsk').innerText = wholeCents(no.ask);
        document.getElementById('noBid').innerText = wholeCents(no.bid);
        document.getElementById('noSpread').innerText = whole(no.spread);

        document.getElementById('askSum').innerText = whole(book.askSum);
        document.getElementById('bidSum').innerText = whole(book.bidSum);

        // History: PnL as whole dollars (clean, readable)
        const history = data.recentTrades || [];
        const historyEl = document.getElementById('history');

        if (!history.length) {
          historyEl.className = 'empty';
          historyEl.innerText = 'Waiting for executions…';
        } else {
          historyEl.className = '';
          historyEl.innerHTML = history.map(t => {
            const pnl = Number(t.pnl || 0);
            const cls = pnl >= 0 ? 'green-text' : 'red-text';
            const sign = pnl >= 0 ? '+' : '−';

            const reason = String(t.reason || '')
              .replace(/[_-]+/g, ' ')
              .trim();

            return `
              <div class="ledger-row">
                <div>
                  <div class="num">${t.time || ''}</div>
                  <div class="small">${reason}</div>
                </div>
                <div class="${cls} num">${sign}${wholeDollars(Math.abs(pnl))}</div>
              </div>
            `;
          }).join('');
        }
      } catch (e) {
        console.error('Dashboard sync error', e);
      }
    }

    setInterval(updateDashboard, 1500);
    updateDashboard();
  </script>
</body>
</html>
