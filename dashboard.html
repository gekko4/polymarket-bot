<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>PolyBot Terminal</title>

  <style>
    :root {
      --bg: #050505;

      /* Card + border */
      --card-border: rgba(59, 130, 246, 0.22); /* blue */
      --card-glow: rgba(14, 165, 233, 0.10);

      /* Text */
      --text: #f1f5f9;
      --muted: #94a3b8;

      /* Accents */
      --cyan: #0ea5e9;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #facc15;

      /* Gold gradient for text */
      --gold-1: #f59e0b;
      --gold-2: #fcd34d;
      --gold-3: #fef08a;

      /* Fonts */
      --money: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 24px 14px;
      background:
        radial-gradient(circle at top right, rgba(14,165,233,0.10), transparent 38%),
        radial-gradient(circle at bottom left, rgba(59,130,246,0.08), transparent 40%),
        radial-gradient(circle at bottom right, rgba(252,211,77,0.05), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: var(--ui);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .gold-text {
      background: linear-gradient(90deg, var(--gold-1), var(--gold-2), var(--gold-3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title {
      text-align: center;
      font-weight: 900;
      letter-spacing: 1.4px;
      margin-bottom: 18px;
      font-size: 1.45rem;
    }

    /* Blue gradient cards */
    .card {
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--card-border);
      background:
        radial-gradient(circle at top left, rgba(14,165,233,0.18), transparent 45%),
        radial-gradient(circle at bottom right, rgba(59,130,246,0.14), transparent 55%),
        linear-gradient(180deg, rgba(15, 23, 42, 0.70), rgba(2, 6, 23, 0.62));
      box-shadow:
        0 14px 40px rgba(0,0,0,0.28),
        0 0 0 1px rgba(255,255,255,0.02) inset,
        0 0 24px var(--card-glow);
      backdrop-filter: blur(14px);
    }

    .hero {
      text-align: center;
      padding: 24px 16px;
    }

    .sub {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.4px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    /* monetary looking numbers */
    .money {
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: 0;
    }

    .balance {
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 3rem;
      font-weight: 900;
    }

    .roi {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      font-weight: 900;
      font-size: 0.95rem;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.18);
    }

    .roi.green {
      color: #34d399;
      border-color: rgba(16,185,129,0.35);
      background: rgba(16,185,129,0.12);
    }

    .roi.red {
      color: #f87171;
      border-color: rgba(239,68,68,0.35);
      background: rgba(239,68,68,0.12);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full { grid-column: 1 / -1; }

    h2 {
      margin: 0 0 12px;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h2::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #60a5fa;
      box-shadow: 0 0 12px rgba(96,165,250,0.45);
      flex: 0 0 auto;
    }

    .metric {
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 1.55rem;
      font-weight: 900;
    }

    .small {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 4px;
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      word-break: break-word;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.03rem;
    }

    .pulse {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--yellow);
      box-shadow: 0 0 12px rgba(250,204,21,0.55);
      animation: blink 1.4s infinite;
      flex-shrink: 0;
    }

    .pulse.active {
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(14,165,233,0.65);
    }

    @keyframes blink {
      0% { opacity: 0.35; }
      50% { opacity: 1; }
      100% { opacity: 0.35; }
    }

    .book {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .book-card {
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 12px;
      border-radius: 14px;
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
    }

    .label {
      color: var(--muted);
      font-family: var(--ui);
      font-size: 0.73rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .cyan { color: var(--cyan); }
    .green-text { color: var(--green); }
    .red-text { color: var(--red); }
    .yellow-text { color: var(--yellow); }

    .mode-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 0.78rem;
      font-weight: 900;
      margin-left: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
    }

    .mode-paper {
      color: #93c5fd;
      border-color: rgba(59,130,246,0.40);
      background: rgba(59,130,246,0.12);
    }

    .mode-live {
      color: #fda4af;
      border-color: rgba(239,68,68,0.40);
      background: rgba(239,68,68,0.12);
    }

    .ledger-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
    }

    .ledger-row:last-child { border-bottom: none; }

    .empty {
      text-align: center;
      color: var(--muted);
      font-family: var(--money);
      font-variant-numeric: tabular-nums lining-nums;
      padding: 18px 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="title gold-text">PolyBot Terminal</div>

    <div class="card hero">
      <div class="sub">Portfolio</div>
      <div id="balance" class="balance money gold-text">$0</div>
      <div id="roi" class="roi green money">+0% ROI</div>
    </div>

    <div class="grid">
      <div class="card full">
        <h2>Engine Status <span id="mode-pill" class="mode-pill mode-paper">Paper</span></h2>

        <div class="status-line">
          <div id="pulse" class="pulse"></div>
          <div id="status" class="gold-text">Initializing</div>
        </div>

        <div id="last-action" class="small">Last action: —</div>

        <div class="book">
          <div class="book-card">
            <div class="label">Yes Book</div>
            <div>Ask: <span id="yes-ask" class="cyan money">—</span></div>
            <div>Bid: <span id="yes-bid" class="money">—</span></div>
            <div>Spread: <span id="yes-spread" class="money">—</span></div>
          </div>

          <div class="book-card">
            <div class="label">No Book</div>
            <div>Ask: <span id="no-ask" class="cyan money">—</span></div>
            <div>Bid: <span id="no-bid" class="money">—</span></div>
            <div>Spread: <span id="no-spread" class="money">—</span></div>
          </div>
        </div>

        <div class="small" style="margin-top: 10px;">
          Ask sum: <span id="ask-sum" class="money">—</span> |
          Bid sum: <span id="bid-sum" class="money">—</span>
        </div>
      </div>

      <div class="card">
        <h2>Win Rate</h2>
        <div id="win-rate" class="metric cyan money">0%</div>
        <div id="win-details" class="small money">0W / 0L</div>
      </div>

      <div class="card">
        <h2>Executions</h2>
        <div id="total-trades" class="metric yellow-text money">0</div>
        <div class="small">Resolved trades</div>
      </div>

      <div class="card full">
        <h2>Trade Ledger</h2>
        <div id="history" class="empty">Waiting for executions…</div>
      </div>
    </div>
  </div>

  <script>
    // Whole-number display (no 0.02 style). Also keeps digits aligned via the .money class.
    function whole(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || n <= 0) return '—';
      return String(Math.round(n));
    }

    // For money: whole dollars (no cents)
    function moneyWhole(amount, currency = 'USD') {
      const n = Number(amount);
      if (!Number.isFinite(n)) return '$0';
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency,
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(Math.round(n));
    }

    // Convert price (0..1 dollars) to whole cents (e.g., 0.52 -> 52)
    function centsWhole(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || n <= 0) return '—';
      return String(Math.round(n * 100));
    }

    async function updateDashboard() {
      try {
        const res = await fetch('/api/live');
        const data = await res.json();

        const stats = data.stats || {};
        const trade = data.trade || {};
        const book = data.currentBook || {};
        const yes = book.YES || {};
        const no = book.NO || {};

        // Balance: whole dollars (no decimals)
        document.getElementById('balance').innerText =
          moneyWhole(stats.currentBalance || 0);

        const roi =
          stats.startingBalance
            ? (((stats.currentBalance - stats.startingBalance) / stats.startingBalance) * 100)
            : 0;

        const roiEl = document.getElementById('roi');
        roiEl.innerText = (roi >= 0 ? '+' : '') + whole(roi) + '% ROI';
        roiEl.className = 'roi ' + (roi >= 0 ? 'green' : 'red') + ' money';

        const winRate =
          stats.totalTrades > 0
            ? (stats.wins / stats.totalTrades) * 100
            : 0;

        document.getElementById('win-rate').innerText = whole(winRate) + '%';
        document.getElementById('win-details').innerText =
          `${whole(stats.wins || 0)}W / ${whole(stats.losses || 0)}L`;
        document.getElementById('total-trades').innerText = whole(stats.totalTrades || 0);

        const mode = (data.mode || 'paper').toUpperCase();
        const modePill = document.getElementById('mode-pill');
        modePill.innerText = mode === 'LIVE' ? 'Live' : 'Paper';
        modePill.className = 'mode-pill ' + (mode === 'LIVE' ? 'mode-live' : 'mode-paper');

        // clean grammar (no underscores)
        const statusText = trade.readableStatus || trade.status || 'Unknown';
        document.getElementById('status').innerText = statusText;

        const last = trade.lastAction ? String(trade.lastAction) : '—';
        document.getElementById('last-action').innerText = 'Last action: ' + last;

        document.getElementById('pulse').className =
          trade.active ? 'pulse active' : 'pulse';

        // Book: whole cents (no decimals)
        document.getElementById('yes-ask').innerText = centsWhole(yes.ask);
        document.getElementById('yes-bid').innerText = centsWhole(yes.bid);
        document.getElementById('yes-spread').innerText = whole(yes.spread);

        document.getElementById('no-ask').innerText = centsWhole(no.ask);
        document.getElementById('no-bid').innerText = centsWhole(no.bid);
        document.getElementById('no-spread').innerText = whole(no.spread);

        document.getElementById('ask-sum').innerText = whole(book.askSum);
        document.getElementById('bid-sum').innerText = whole(book.bidSum);

        const history = data.recentTrades || [];
        const historyEl = document.getElementById('history');

        if (!history.length) {
          historyEl.className = 'empty';
          historyEl.innerText = 'Waiting for executions…';
        } else {
          historyEl.className = '';
          historyEl.innerHTML = history.map(t => {
            const pnl = Number(t.pnl || 0);
            const cls = pnl >= 0 ? 'green-text' : 'red-text';
            const sign = pnl >= 0 ? '+' : '−';

            // Whole-number PnL (no decimals)
            return `
              <div class="ledger-row">
                <div>
                  <div>${t.time || ''}</div>
                  <div class="small">${t.reason || ''}</div>
                </div>
                <div class="${cls}">${sign}${moneyWhole(Math.abs(pnl))}</div>
              </div>
            `;
          }).join('');
        }
      } catch (e) {
        console.error('Dashboard sync error', e);
      }
    }

    setInterval(updateDashboard, 1500);
    updateDashboard();
  </script>
</body>
</html>
