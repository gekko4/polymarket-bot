<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PolyBot Dashboard</title>
  <style>
    :root {
      --bg: #030407;
      --card-bg: linear-gradient(180deg, rgba(17, 24, 39, 0.6) 0%, rgba(10, 14, 23, 0.8) 100%);
      --card-border: rgba(255, 255, 255, 0.06);
      --card-highlight: rgba(255, 255, 255, 0.12);
      
      --text-main: #f8fafc;
      --text-muted: #8b95a3;
      
      --gold-light: #fceea7;
      --gold-mid: #d4af37;
      --gold-dark: #aa771c;
      
      --blue-accent: #3b82f6;
      --blue-deep: #1e3a8a;
      
      --green: #10b981;
      --red: #ef4444;
      
      --radius: 20px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--text-main);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      /* Deep black to dark blue elegant gradient */
      background: radial-gradient(circle at 50% 0%, var(--blue-deep) 0%, var(--bg) 50%, var(--bg) 100%);
      background-color: var(--bg);
      padding: 20px 16px 32px;
    }

    .app { 
      width: 100%; 
      max-width: 480px; 
      margin: 0 auto; 
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Navigation */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 8px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--gold-light), var(--gold-mid));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold-mid);
      box-shadow: 0 0 10px var(--gold-mid);
    }
    .dot.on { background: var(--green); box-shadow: 0 0 10px var(--green); }

    /* Cards Base */
    .card {
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      border-top-color: var(--card-highlight);
      background: var(--card-bg);
      box-shadow: 0 16px 32px rgba(0,0,0,0.4);
      padding: 18px;
      backdrop-filter: blur(12px);
    }

    /* Hero Section */
    .hero {
      position: relative;
      overflow: hidden;
      padding: 24px 20px;
    }
    
    .hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-mid), transparent);
      opacity: 0.4;
    }

    .hero-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .balance {
      font-size: 3.2rem;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      margin-bottom: 16px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.03);
    }

    .stat { display: flex; flex-direction: column; gap: 4px; }
    .stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
    .stat-val { font-size: 0.9rem; font-weight: 700; color: var(--text-main); }
    .stat-val.good { color: var(--green); }
    .stat-val.bad { color: var(--red); }

    /* Market Info Compact */
    .market-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 12px;
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .time-left {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gold-mid);
      white-space: nowrap;
    }

    .bar {
      flex: 1;
      height: 6px;
      background: rgba(0,0,0,0.5);
      border-radius: 999px;
      overflow: hidden;
    }
    
    .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-mid), var(--gold-light));
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Price & Position Row */
    .trade-status {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .price-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .price-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255,255,255,0.03);
      padding: 12px;
      border-radius: 14px;
      text-align: center;
    }

    .price-box .label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .price-box .val {
      font-size: 1.4rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .val.yes { color: var(--blue-accent); }
    .val.no { color: var(--gold-mid); }

    .position-info {
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pos-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .pos-details { font-size: 0.85rem; font-weight: 700; color: var(--text-main); }
    .pos-details.active { color: var(--gold-mid); }

    /* History */
    .history-header {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    .history-list { display: flex; flex-direction: column; gap: 0; }
    
    .trade {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .trade:last-child { border-bottom: none; padding-bottom: 0; }
    
    .trade-title { font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 2px;}
    .trade-meta { font-size: 0.7rem; color: var(--text-muted); }
    
    .pnl { font-size: 0.9rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .pnl.green { color: var(--green); }
    .pnl.red { color: var(--red); }

    .empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <main class="app">
    
    <header class="top">
      <div class="brand">PolyBot</div>
      <div class="status-pill"><span id="pulse" class="dot"></span><span id="status">Syncing</span></div>
    </header>

    <!-- Main Balance & Stats -->
    <section class="card hero">
      <div class="hero-label">Paper Balance</div>
      <div id="balance" class="balance">$0.00</div>
      
      <div class="stats-row">
        <div class="stat">
          <span class="stat-label">ROI</span>
          <span id="roi" class="stat-val">0.00%</span>
        </div>
        <div class="stat">
          <span class="stat-label">Win Rate</span>
          <span id="winrate" class="stat-val">0.0%</span>
        </div>
        <div class="stat" style="text-align: right;">
          <span class="stat-label">W / L</span>
          <span id="wl" class="stat-val">0 / 0</span>
        </div>
      </div>
    </section>

    <!-- Compressed Market & Position Card -->
    <section class="card">
      <div id="marketTitle" class="market-title">Loading Market...</div>
      
      <div class="progress-wrapper">
        <div class="time-left" id="left">--:--</div>
        <div class="bar"><div id="progress" class="fill"></div></div>
      </div>

      <div class="trade-status">
        <div class="price-row">
          <div class="price-box">
            <div class="label">YES Ask</div>
            <div id="yes" class="val yes">—</div>
          </div>
          <div class="price-box">
            <div class="label">NO Ask</div>
            <div id="no" class="val no">—</div>
          </div>
        </div>

        <div class="position-info">
          <div class="pos-label">Status</div>
          <div id="posDetails" class="pos-details">Waiting for entry...</div>
        </div>
      </div>
    </section>

    <!-- Compact History -->
    <section class="card">
      <div class="history-header">Recent Trades</div>
      <div id="history" class="history-list">
        <div class="empty">No settled trades yet.</div>
      </div>
    </section>

  </main>

  <script>
    const $ = id => document.getElementById(id);

    function cents(x) {
      const n = Number(x);
      if (!Number.isFinite(n) || n <= 0) return '—';
      return Math.round(n * 100) + '¢';
    }
    
    function money(x, d = 2) {
      const n = Number(x);
      return '$' + (Number.isFinite(n) ? n : 0).toFixed(d);
    }
    
    function signed(x, d = 2) {
      const n = Number(x);
      if (!Number.isFinite(n)) return '$0.00';
      return (n >= 0 ? '+$' : '-$') + Math.abs(n).toFixed(d);
    }
    
    function clock(sec) {
      const n = Number(sec);
      if (!Number.isFinite(n)) return '—';
      const m = Math.floor(Math.max(0, n) / 60);
      const s = Math.floor(Math.max(0, n) % 60);
      return m + ':' + String(s).padStart(2, '0');
    }

    function renderHistory(items) {
      if (!items || !items.length) {
        $('history').innerHTML = '<div class="empty">No settled trades yet.</div>';
        return;
      }
      // Show only top 3 to keep it mobile-friendly
      $('history').innerHTML = items.slice(0, 3).map(t => {
        const pnl = Number(t.pnl || 0);
        const cls = pnl >= 0 ? 'green' : 'red';
        const title = String(t.reason || 'Settlement').replaceAll('_', ' ');
        return `<div class="trade">
          <div>
            <div class="trade-title">${title}</div>
            <div class="trade-meta">${cents(t.entry)} → ${cents(t.exit)}</div>
          </div>
          <div class="pnl ${cls}">${signed(pnl)}</div>
        </div>`;
      }).join('');
    }

    async function tick() {
      try {
        const res = await fetch('/api/live', { cache: 'no-store' });
        const data = await res.json();
        const stats = data.stats || {};
        const trade = data.trade || {};
        const prices = data.currentPrices || {};
        const market = data.market || {};

        const bal = Number(stats.currentBalance || 0);
        const start = Number(stats.startingBalance || 0);
        const total = Number(stats.totalTrades || 0);
        const wins = Number(stats.wins || 0);
        const losses = Number(stats.losses || 0);
        const roi = start ? ((bal - start) / start) * 100 : 0;
        const wr = total ? (wins / total) * 100 : 0;

        // Hero Update
        $('balance').textContent = money(bal, 2);
        
        $('roi').textContent = `${roi >= 0 ? '+' : ''}${roi.toFixed(2)}%`;
        $('roi').className = 'stat-val ' + (roi >= 0 ? 'good' : 'bad');
        
        $('winrate').textContent = `${wr.toFixed(1)}%`;
        $('wl').textContent = `${wins} / ${losses}`;

        // Market Details Update
        $('marketTitle').textContent = market.title || 'Scanning markets...';
        $('left').textContent = clock(market.secondsLeft) + ' Left';
        $('progress').style.width = Math.max(0, Math.min(100, (Number(market.elapsedSec || 0) / 300) * 100)) + '%';

        // Price Updates
        $('yes').textContent = cents(prices.YES);
        $('no').textContent = cents(prices.NO);

        // Position Updates
        if (trade.active) {
          $('pulse').className = 'dot on';
          $('status').textContent = 'Holding';
          $('posDetails').className = 'pos-details active';
          $('posDetails').textContent = `Holding ${trade.side || 'Open'} @ ${cents(trade.entryPrice)}`;
        } else {
          $('pulse').className = 'dot';
          $('status').textContent = market.slug ? 'Hunting' : 'Syncing';
          $('posDetails').className = 'pos-details';
          $('posDetails').textContent = market.slug ? 'Waiting for entry...' : 'No market loaded';
        }

        renderHistory(data.recentTrades || []);
      } catch (e) {
        $('status').textContent = 'Offline';
      }
    }

    tick();
    setInterval(tick, 1200);
  </script>
</body>
</html>
